<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Wan 分镜视频生成器</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#172033;font:15px system-ui,-apple-system,"PingFang SC",sans-serif}.wrap{max-width:920px;margin:36px auto;padding:0 18px}header,.card{background:#fff;border:1px solid #e4e8f0;border-radius:16px;padding:22px;margin-bottom:16px;box-shadow:0 4px 16px #24324a0a}h1{font-size:25px;margin:0 0 8px}p{color:#657189;margin:5px 0}h2{font-size:18px;margin:0 0 15px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}label{display:block;font-size:13px;color:#536078;margin:0 0 5px}input,textarea,select{width:100%;border:1px solid #d9dfeb;border-radius:9px;padding:10px;font:inherit;background:white}textarea{min-height:82px;resize:vertical}.scene{border:1px solid #e8ebf2;border-radius:12px;padding:14px;margin:12px 0}.scene h3{font-size:15px;margin:0 0 10px}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:12px}button{border:0;border-radius:9px;padding:10px 15px;background:#2767e8;color:white;font-weight:650;cursor:pointer}button.secondary{background:#edf2fc;color:#284675}button:disabled{opacity:.5;cursor:wait}.status{margin-top:12px;color:#44516b}.task{padding:12px 0;border-top:1px solid #edf0f5}.task a{margin-right:12px;color:#2163dc}.hint{font-size:12px;color:#758098}@media(max-width:650px){.grid{grid-template-columns:1fr}.wrap{margin:18px auto}}
</style></head><body><main class="wrap">
<header><h1>Wan3.0 批量分镜生成</h1><p>提交首帧和提示词到阿里百炼，任务完成后可下载视频或 ZIP。</p></header>
<section class="card"><h2>百炼配置</h2><div class="grid"><div><label>模型</label><select id="model"><option>wan3.0-video-prime</option><option>wan3.0-video</option></select></div><div><label>分镜数量（最多 5 个）</label><select id="count"><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option></select></div></div><p class="hint">API Key 由部署者配置为 Cloudflare Worker Secret，不会发送给浏览器。</p></section>
<section class="card"><h2>分镜内容</h2><div id="scenes"></div><div class="row"><button id="submit">提交视频生成</button><button class="secondary" id="refresh">刷新任务</button><button class="secondary" id="zip">下载成功视频 ZIP</button></div><div class="status" id="status"></div></section>
<section class="card"><h2>任务记录</h2><div id="tasks"></div></section></main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script><script>
const $=s=>document.querySelector(s), clientId=localStorage.getItem('wan-client-id')||crypto.randomUUID();localStorage.setItem('wan-client-id',clientId);
function draw(){const n=+$(`#count`).value;$('#scenes').innerHTML=Array.from({length:n},(_,i)=>`<div class="scene"><h3>分镜 ${i+1}</h3><div class="grid"><div><label>首帧图片</label><input type="file" accept="image/*" class="image"></div><div><label>视频时长（秒）</label><select class="duration"><option>5</option><option>10</option><option>15</option></select></div><div><label>提示词</label><textarea class="prompt" placeholder="描述画面、动作和镜头"></textarea></div><div><label>对白 / 旁白（可选）</label><textarea class="dialogue"></textarea></div><div><label>画幅</label><select class="ratio"><option value="16:9">横屏 16:9</option><option value="9:16">竖屏 9:16</option></select></div><div><label><input type="checkbox" class="audio" style="width:auto"> 生成音轨</label></div></div></div>`).join('')}
$('#count').onchange=draw;draw();
let appPassword=sessionStorage.getItem('wan-app-password')||'';if(!appPassword){appPassword=prompt('请输入应用访问密码（部署者设置的 APP_PASSWORD）')||'';if(appPassword)sessionStorage.setItem('wan-app-password',appPassword)}
async function api(path,opts={}){const r=await fetch(path,{...opts,headers:{'content-type':'application/json','x-client-id':clientId,'authorization':`Bearer ${appPassword}`,...opts.headers}}),d=await r.json();if(r.status===401){sessionStorage.removeItem('wan-app-password');appPassword=prompt('访问密码无效，请重新输入')||'';if(appPassword)sessionStorage.setItem('wan-app-password',appPassword);throw Error(d.error||'未授权')}if(!r.ok)throw Error(d.error||JSON.stringify(d));return d}
const dataURL=f=>new Promise((resolve,reject)=>{const r=new FileReader;r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(f)});
$('#submit').onclick=async()=>{const b=$('#submit');b.disabled=true;$('#status').textContent='正在提交分镜…';try{const scenes=[];for(const el of document.querySelectorAll('.scene')){const file=el.querySelector('.image').files[0];scenes.push({image:file?await dataURL(file):null,prompt:el.querySelector('.prompt').value.trim(),dialogue:el.querySelector('.dialogue').value.trim(),duration:el.querySelector('.duration').value,ratio:el.querySelector('.ratio').value,audio:el.querySelector('.audio').checked})}const d=await api('/api/submit',{method:'POST',body:JSON.stringify({model:$('#model').value,scenes})});$('#status').textContent=`已提交 ${d.tasks.filter(t=>t.id).length} 个任务。`;await refresh()}catch(e){$('#status').textContent=e.message}finally{b.disabled=false}};
async function refresh(){try{const d=await api('/api/tasks');$('#tasks').innerHTML=d.tasks.map(t=>`<div class="task"><b>分镜 ${t.scene_number}</b> · ${t.status}${t.error?` · ${t.error}`:''}${t.video_key?` · <button class="secondary play" data-id="${t.id}" data-scene="${t.scene_number}">页面播放</button> <button class="secondary download" data-id="${t.id}" data-scene="${t.scene_number}">下载视频</button><div class="player" id="player-${t.id}"></div>`:''} · <button class="secondary poll" data-id="${t.id}">查询状态</button></div>`).join('')||'<p>暂无任务</p>';document.querySelectorAll('.poll').forEach(b=>b.onclick=async()=>{b.disabled=true;try{await api('/api/tasks/'+b.dataset.id,{method:'POST',body:'{}'});await refresh()}catch(e){$('#status').textContent=e.message}finally{b.disabled=false}});document.querySelectorAll('.play,.download').forEach(b=>b.onclick=async()=>{b.disabled=true;try{const r=await fetch('/api/videos/'+b.dataset.id,{headers:{'x-client-id':clientId,'authorization':`Bearer ${appPassword}`}});if(!r.ok)throw Error('视频获取失败，请刷新页面并重新登录后重试');const blob=await r.blob(),src=URL.createObjectURL(blob);if(b.classList.contains('play')){$(`#player-${b.dataset.id}`).innerHTML=`<video controls playsinline style="display:block;width:min(100%,640px);max-height:70vh;margin-top:12px;border-radius:10px;background:#111" src="${src}"></video>`}else{const a=document.createElement('a');a.href=src;a.download=`scene-${b.dataset.scene}.mp4`;a.click();setTimeout(()=>URL.revokeObjectURL(src),60000)}}catch(e){$('#status').textContent=e.message}finally{b.disabled=false}})}catch(e){$('#status').textContent=e.message}}
$('#refresh').onclick=refresh;$('#zip').onclick=async()=>{try{const d=await api('/api/tasks'),ready=d.tasks.filter(t=>t.video_key);if(!ready.length)throw Error('暂无可下载视频');const z=new JSZip;for(const t of ready){const r=await fetch('/api/videos/'+t.id,{headers:{'x-client-id':clientId,'authorization':`Bearer ${appPassword}`}});if(!r.ok)throw Error('下载分镜失败');z.file(`scene-${String(t.scene_number).padStart(2,'0')}.mp4`,await r.blob())}const blob=await z.generateAsync({type:'blob'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='wan-scenes.zip';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),60000)}catch(e){$('#status').textContent=e.message}};refresh();
</script></body></html>
